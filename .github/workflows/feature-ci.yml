name: Feature Branch CI

# トリガは .claude/CLAUDE.md のブランチ命名規則とマージ経路（作業ブランチ → main）に対応させる。
# かつてあった dev ブランチは 2026-09-23 に削除した（main から364コミット遅れの放置ブランチだった）。
# push は作業ブランチへの直接の変更を、pull_request は base へマージした結果を検証する。
# 両方が走るケースでは検証対象が異なる（前者は head、後者は head を base へマージしたもの）ため、
# 重複ではなく別種の検証として扱う。
#
# paths フィルタは置かない。format:check が docs/ の .md も検査対象にしているため、
# ドキュメントだけの変更でも走らせる必要がある。
on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "docs/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 同じ ref へ続けて push したとき、古い run を捨てる。
# E2E がブラウザを起動するようになったので、無駄な並走を止める価値が出た。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm install だけで完結する検査をここへ束ねる。
  # secrets もビルド成果物も要求しないため、fork からの PR でも結果が出る。
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      # 追跡 .md の相対リンクを解決する（#211）。git ls-files 以外に何も要求しないため、
      # このジョブの「install だけで完結する」性質を崩さない。
      # **作業ツリーではなく Git の追跡対象を歩く。** 詳細は scripts/assert-doc-links.mjs の冒頭。
      - name: Check doc links
        run: pnpm run check:doc-links

      # 追跡 .md が300行以下かを見る（#322）。規約は .claude/CLAUDE.md の「命名・配置ガイド」。
      # 人の目しか無かったため、#318 では 326 行へ伸びたことにマージ直前まで気づかなかった。
      # **導入時点ですでに超えていたファイルは上限つきで記録してあり、伸ばすと落ちる**（scripts/assert-doc-line-budget.mjs 冒頭）。
      # git ls-files 以外に何も要求しないため、このジョブの「install だけで完結する」性質を崩さない。
      - name: Check doc line budget
        run: pnpm run check:doc-lines

      # Tailwind の走査範囲に、出力されうる禁止色ユーティリティが無いことを見る（#230）。
      # **ESLint はコメントを見ないが Tailwind は読む。** その死角で、消したはずの紫と桃の
      # ユーティリティが本番CSSへ出続けていた。git ls-files 以外に何も要求しないため、
      # このジョブの「install だけで完結する」性質を崩さない。
      - name: Check restricted colors
        run: pnpm run check:colors

      # public/ の画像が scripts/static-image-manifest.mjs の契約どおりかを見る（#241）。
      # 静的画像は Vercel の変換をやめて実体をそのまま配るようになったので、
      # **配信バイトがリポジトリの中身そのもの**になった。役割（OGP や favicon を
      # AVIF 化していないか）・形式・寸法・バイト予算・参照の解決を、ここで落とす。
      # **.webp → .avif の張り替え漏れはビルドも lint も型検査も通り、本番で 404 になる。**
      # git ls-files 以外に何も要求しないため、このジョブの性質を崩さない。
      - name: Check static images
        run: pnpm run check:images

      # next build も型エラーで落ちる（ignoreBuildErrors 未設定）が、この検査は
      # 別に置く。secrets から独立していて数十秒で落ちること、そして
      # ignoreBuildErrors: true を1行足せば build 側の型検査だけは消せてしまうため。
      - name: Run type check
        run: pnpm run type-check

      # 純粋関数のユニットテスト。DOM もネットワークも要求しないため、
      # このジョブの「install だけで完結する」性質を崩さない。
      - name: Run unit tests
        run: pnpm run test

  # 実ブラウザでのレイアウト実測。#148（盤面が 0px に潰れる）の再発防止装置。
  # CSS の百分率高さが解決されるかはレイアウトエンジンの仕事なので、
  # 型でもユニットテストでも表現できない。
  layout-e2e:
    name: Layout E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # headless 実行しかしないので full Chromium（+約100MB）は落とさない。
      # ブラウザバイナリのキャッシュは入れていない。Playwright 公式が
      # 「復元がダウンロードとほぼ同じ時間で、Linux では OS 依存パッケージを
      # キャッシュできない」として非推奨としているため。実測を見てから判断する。
      - name: Install Chromium (headless shell only)
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # env を渡さないのは意図的である。フィクスチャ経路は getEventsList() を
      # 呼ばないため microCMS のシークレットが要らない。fork からの PR でも同じ判定が出る
      # （build ジョブは fork PR では secrets が届かず、先頭の検査を飛ばして空データのまま緑になる。#352）。
      - name: Run layout assertions
        run: pnpm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      # 資格情報が空でも src/lib/microcms.ts は空データを返し、ビルドは緑になる。
      # そのせいで 2026-09-30 まで Build Check は microCMS を一度も読めていなかった（#352）。
      # 空なら install より先に落とす。値が誤っている場合は microCMS が 401 を返し、
      # microcmsGet() が例外を投げてビルドが落ちるため、ここでは有無だけを見る。
      # fork からの PR には secrets が渡らないので、同じリポジトリの push / PR に限る。
      - name: Require build credentials and URL
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
        run: |
          missing=""
          for name in MICROCMS_SERVICE_DOMAIN MICROCMS_API_KEY NEXT_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Build Check に渡す値が空です::未登録:$missing。MICROCMS_* は Repository secrets に、NEXT_PUBLIC_* は Repository variables に登録すること（Environment に置くとこのジョブからは空に見える）。手順は docs/dev/ci-env.md。"
            exit 1
          fi

          echo "microCMS の secrets 2本と NEXT_PUBLIC_URL が届いています。"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # secrets は Repository secrets に置く。Environment secrets はこのジョブ（environment: 無し）からは
      # 空文字に見え、先頭の検査で落ちる（#352）。
      - name: Build project
        run: pnpm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
